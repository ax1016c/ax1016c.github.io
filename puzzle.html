<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>▦ SLIDE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0610;
    --surface: #130d1e;
    --neon-pink: #ff2d95;
    --neon-cyan: #00f0ff;
    --neon-purple: #c850ff;
    --glow-pink: rgba(255,45,149,0.4);
    --glow-cyan: rgba(0,240,255,0.3);
    --text: #e8e0f0;
    --text-dim: #8a7a9a;
    --border: rgba(200,80,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ─── SCANLINES ─── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ─── AMBIENT GLOW ─── */
  .ambient {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }
  .ambient-1 {
    background: var(--neon-pink);
    top: -200px; left: -100px;
    animation: drift1 12s ease-in-out infinite;
  }
  .ambient-2 {
    background: var(--neon-cyan);
    bottom: -200px; right: -100px;
    animation: drift2 14s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(80px, 60px); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-60px, -80px); }
  }

  /* ─── HEADER ─── */
  .header {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px var(--glow-pink));
  }

  .header .sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  /* ─── STATS BAR ─── */
  .stats {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.2rem;
    justify-content: center;
  }

  .stat {
    text-align: center;
    min-width: 80px;
  }

  .stat-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .stat-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--neon-cyan);
    text-shadow: 0 0 15px var(--glow-cyan);
  }

  /* ─── PUZZLE CONTAINER ─── */
  .puzzle-wrap {
    position: relative;
    z-index: 1;
  }

  .puzzle {
    position: relative;
    border: 2px solid var(--neon-purple);
    border-radius: 8px;
    box-shadow:
      0 0 30px rgba(200,80,255,0.15),
      inset 0 0 30px rgba(200,80,255,0.05);
    overflow: hidden;
    background: var(--surface);
  }

  .tile {
    position: absolute;
    cursor: pointer;
    transition: left 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                top 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    border-radius: 3px;
    overflow: hidden;
    backface-visibility: hidden;
  }

  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid rgba(200,80,255,0.2);
    border-radius: 3px;
    pointer-events: none;
  }

  .tile:hover::after {
    border-color: rgba(0,240,255,0.5);
    box-shadow: inset 0 0 15px rgba(0,240,255,0.1);
  }

  .tile:active {
    filter: brightness(1.2);
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-repeat: no-repeat;
  }

  /* ─── TILE NUMBERS (optional overlay) ─── */
  .tile-num {
    position: absolute;
    top: 4px;
    left: 4px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5);
    padding: 1px 5px;
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .show-numbers .tile-num {
    opacity: 1;
  }

  /* ─── CONTROLS ─── */
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 0.6rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.6rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(19,13,30,0.8);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  .btn:hover {
    border-color: var(--neon-pink);
    color: var(--neon-pink);
    box-shadow: 0 0 20px rgba(255,45,149,0.15);
  }

  .btn-primary {
    border-color: rgba(255,45,149,0.4);
    color: var(--neon-pink);
  }

  .btn-primary:hover {
    background: rgba(255,45,149,0.1);
  }

  .btn.active {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0,240,255,0.1);
  }

  /* ─── DIFFICULTY SELECTOR ─── */
  .diff-wrap {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  .diff-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.5rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-right: 0.3rem;
  }

  .diff-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.3s;
  }

  .diff-btn.active {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    background: rgba(0,240,255,0.08);
  }

  /* ─── PREVIEW ─── */
  .preview-toggle {
    position: absolute;
    top: -35px;
    right: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.3s;
    text-transform: uppercase;
  }

  .preview-toggle:hover { color: var(--neon-cyan); }

  .preview-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    background-size: cover;
    background-position: center;
  }

  .preview-overlay.show {
    opacity: 0.85;
  }

  /* ─── WIN STATE ─── */
  .win-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10,5,16,0.92);
    backdrop-filter: blur(20px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
  }

  .win-overlay.show {
    display: flex;
    animation: fade-in 0.5s ease-out;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .win-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px var(--glow-pink));
    animation: win-glow 2s ease-in-out infinite;
  }

  @keyframes win-glow {
    0%, 100% { filter: drop-shadow(0 0 30px var(--glow-pink)); }
    50% { filter: drop-shadow(0 0 50px var(--glow-cyan)); }
  }

  .win-stats {
    margin-top: 1.5rem;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .win-stats span {
    color: var(--neon-cyan);
    font-weight: 700;
  }

  .win-img {
    margin-top: 2rem;
    width: min(300px, 80vw);
    height: min(300px, 80vw);
    border-radius: 10px;
    border: 2px solid var(--neon-purple);
    box-shadow: 0 0 40px rgba(200,80,255,0.2);
    background-size: cover;
    background-position: center;
    animation: reveal-img 1s ease-out 0.3s both;
  }

  @keyframes reveal-img {
    from { opacity: 0; transform: scale(0.8) rotateX(10deg); }
    to { opacity: 1; transform: scale(1) rotateX(0); }
  }

  .win-overlay .btn {
    margin-top: 2rem;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 500px) {
    .stats { gap: 1rem; }
    .controls { gap: 0.4rem; }
    .header { margin-bottom: 1rem; }
  }
</style>
</head>
<body>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<!-- HEADER -->
<div class="header">
  <h1>SLIDE_PUZZLE</h1>
  <div class="sub">resuelve la imagen oculta</div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat">
    <div class="stat-label">Moves</div>
    <div class="stat-val" id="moveCount">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Time</div>
    <div class="stat-val" id="timer">0:00</div>
  </div>
  <div class="stat">
    <div class="stat-label">Best</div>
    <div class="stat-val" id="bestScore">—</div>
  </div>
</div>

<!-- PUZZLE -->
<div class="puzzle-wrap">
  <div class="preview-toggle" id="previewBtn" onmousedown="showPreview()" onmouseup="hidePreview()" ontouchstart="showPreview()" ontouchend="hidePreview()">👁 Preview</div>
  <div class="puzzle" id="puzzle">
    <div class="preview-overlay" id="previewOverlay"></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="btn btn-primary" onclick="shufflePuzzle()">↻ Shuffle</button>
  <button class="btn" id="numToggle" onclick="toggleNumbers()">123</button>
  <div class="diff-wrap">
    <span class="diff-label">Grid</span>
    <button class="diff-btn active" data-size="3" onclick="setSize(3)">3×3</button>
    <button class="diff-btn" data-size="4" onclick="setSize(4)">4×4</button>
    <button class="diff-btn" data-size="5" onclick="setSize(5)">5×5</button>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay" id="winOverlay">
  <div class="win-title">SOLVED</div>
  <div class="win-stats">
    <span id="winMoves">0</span> moves · <span id="winTime">0:00</span>
  </div>
  <div class="win-img" id="winImg"></div>
  <button class="btn btn-primary" onclick="closeWin()">▶ Play again</button>
</div>

<script>
  // ─── CONFIG ───
  const IMAGE_SRC = 'puzzle.png';
  let gridSize = 3;
  let puzzlePixels = Math.min(window.innerWidth - 40, window.innerHeight - 280, 420);
  let tileSize = puzzlePixels / gridSize;
  let tiles = [];
  let emptyPos = { row: gridSize - 1, col: gridSize - 1 };
  let moves = 0;
  let timerInterval = null;
  let seconds = 0;
  let started = false;
  let showNums = false;

  // ─── INIT ───
  const puzzleEl = document.getElementById('puzzle');
  const previewOverlay = document.getElementById('previewOverlay');

  function init() {
    puzzlePixels = Math.min(window.innerWidth - 40, window.innerHeight - 280, 420);
    tileSize = puzzlePixels / gridSize;
    puzzleEl.style.width = puzzlePixels + 'px';
    puzzleEl.style.height = puzzlePixels + 'px';
    previewOverlay.style.backgroundImage = `url(${IMAGE_SRC})`;

    // Clear
    puzzleEl.querySelectorAll('.tile').forEach(t => t.remove());
    tiles = [];
    moves = 0;
    seconds = 0;
    started = false;
    clearInterval(timerInterval);
    document.getElementById('moveCount').textContent = '0';
    document.getElementById('timer').textContent = '0:00';

    const total = gridSize * gridSize;
    emptyPos = { row: gridSize - 1, col: gridSize - 1 };

    for (let i = 0; i < total - 1; i++) {
      const row = Math.floor(i / gridSize);
      const col = i % gridSize;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.width = tileSize + 'px';
      tile.style.height = tileSize + 'px';
      tile.style.left = col * tileSize + 'px';
      tile.style.top = row * tileSize + 'px';
      tile.dataset.index = i;
      tile.dataset.row = row;
      tile.dataset.col = col;

      const inner = document.createElement('div');
      inner.className = 'tile-inner';
      inner.style.backgroundImage = `url(${IMAGE_SRC})`;
      inner.style.backgroundSize = `${puzzlePixels}px ${puzzlePixels}px`;
      inner.style.backgroundPosition = `-${col * tileSize}px -${row * tileSize}px`;
      tile.appendChild(inner);

      const num = document.createElement('div');
      num.className = 'tile-num';
      num.textContent = i + 1;
      tile.appendChild(num);

      tile.addEventListener('click', () => moveTile(tile));
      puzzleEl.appendChild(tile);
      tiles.push({
        el: tile,
        correctRow: row,
        correctCol: col,
        currentRow: row,
        currentCol: col
      });
    }

    if (showNums) puzzleEl.classList.add('show-numbers');
    else puzzleEl.classList.remove('show-numbers');

    shufflePuzzle();
  }

  // ─── MOVE ───
  function moveTile(tileEl) {
    const tile = tiles.find(t => t.el === tileEl);
    if (!tile) return;

    const dr = Math.abs(tile.currentRow - emptyPos.row);
    const dc = Math.abs(tile.currentCol - emptyPos.col);

    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
      if (!started) {
        started = true;
        timerInterval = setInterval(() => {
          seconds++;
          document.getElementById('timer').textContent = formatTime(seconds);
        }, 1000);
      }

      const oldRow = tile.currentRow;
      const oldCol = tile.currentCol;
      tile.currentRow = emptyPos.row;
      tile.currentCol = emptyPos.col;
      emptyPos.row = oldRow;
      emptyPos.col = oldCol;

      tile.el.style.left = tile.currentCol * tileSize + 'px';
      tile.el.style.top = tile.currentRow * tileSize + 'px';

      moves++;
      document.getElementById('moveCount').textContent = moves;

      if (checkWin()) winGame();
    }
  }

  // ─── KEYBOARD SUPPORT ───
  document.addEventListener('keydown', (e) => {
    let targetRow, targetCol;
    switch(e.key) {
      case 'ArrowUp':    targetRow = emptyPos.row + 1; targetCol = emptyPos.col; break;
      case 'ArrowDown':  targetRow = emptyPos.row - 1; targetCol = emptyPos.col; break;
      case 'ArrowLeft':  targetRow = emptyPos.row; targetCol = emptyPos.col + 1; break;
      case 'ArrowRight': targetRow = emptyPos.row; targetCol = emptyPos.col - 1; break;
      default: return;
    }
    e.preventDefault();
    const tile = tiles.find(t => t.currentRow === targetRow && t.currentCol === targetCol);
    if (tile) moveTile(tile.el);
  });

  // ─── SHUFFLE ───
  function shufflePuzzle() {
    moves = 0;
    seconds = 0;
    started = false;
    clearInterval(timerInterval);
    document.getElementById('moveCount').textContent = '0';
    document.getElementById('timer').textContent = '0:00';

    // Fisher-Yates on solvable permutation
    let count = 200 + gridSize * 100;
    for (let i = 0; i < count; i++) {
      const neighbors = tiles.filter(t => {
        const dr = Math.abs(t.currentRow - emptyPos.row);
        const dc = Math.abs(t.currentCol - emptyPos.col);
        return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
      });
      const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
      const oldRow = pick.currentRow;
      const oldCol = pick.currentCol;
      pick.currentRow = emptyPos.row;
      pick.currentCol = emptyPos.col;
      emptyPos.row = oldRow;
      emptyPos.col = oldCol;
      pick.el.style.left = pick.currentCol * tileSize + 'px';
      pick.el.style.top = pick.currentRow * tileSize + 'px';
    }
  }

  // ─── CHECK WIN ───
  function checkWin() {
    return tiles.every(t => t.currentRow === t.correctRow && t.currentCol === t.correctCol);
  }

  // ─── WIN ───
  function winGame() {
    clearInterval(timerInterval);
    const key = `best_${gridSize}`;
    const prev = localStorage.getItem(key);
    if (!prev || moves < parseInt(prev)) {
      localStorage.setItem(key, moves);
    }
    updateBest();

    setTimeout(() => {
      document.getElementById('winMoves').textContent = moves;
      document.getElementById('winTime').textContent = formatTime(seconds);
      document.getElementById('winImg').style.backgroundImage = `url(${IMAGE_SRC})`;
      document.getElementById('winOverlay').classList.add('show');
    }, 400);
  }

  function closeWin() {
    document.getElementById('winOverlay').classList.remove('show');
    shufflePuzzle();
  }

  function updateBest() {
    const key = `best_${gridSize}`;
    const val = localStorage.getItem(key);
    document.getElementById('bestScore').textContent = val ? val : '—';
  }

  // ─── PREVIEW ───
  function showPreview() { previewOverlay.classList.add('show'); }
  function hidePreview() { previewOverlay.classList.remove('show'); }

  // ─── NUMBERS TOGGLE ───
  function toggleNumbers() {
    showNums = !showNums;
    puzzleEl.classList.toggle('show-numbers', showNums);
    document.getElementById('numToggle').classList.toggle('active', showNums);
  }

  // ─── GRID SIZE ───
  function setSize(n) {
    gridSize = n;
    document.querySelectorAll('.diff-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.size) === n);
    });
    init();
  }

  // ─── FORMAT ───
  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // ─── TOUCH SWIPE (mobile) ───
  let touchStart = null;
  puzzleEl.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  puzzleEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (Math.max(absDx, absDy) < 20) return; // too small

    let targetRow, targetCol;
    if (absDx > absDy) {
      // horizontal swipe
      if (dx > 0) { targetRow = emptyPos.row; targetCol = emptyPos.col - 1; }
      else { targetRow = emptyPos.row; targetCol = emptyPos.col + 1; }
    } else {
      // vertical swipe
      if (dy > 0) { targetRow = emptyPos.row - 1; targetCol = emptyPos.col; }
      else { targetRow = emptyPos.row + 1; targetCol = emptyPos.col; }
    }

    const tile = tiles.find(t => t.currentRow === targetRow && t.currentCol === targetCol);
    if (tile) moveTile(tile.el);
    touchStart = null;
  }, { passive: true });

  // ─── RESIZE ───
  window.addEventListener('resize', () => {
    puzzlePixels = Math.min(window.innerWidth - 40, window.innerHeight - 280, 420);
    tileSize = puzzlePixels / gridSize;
    puzzleEl.style.width = puzzlePixels + 'px';
    puzzleEl.style.height = puzzlePixels + 'px';
    tiles.forEach(t => {
      t.el.style.width = tileSize + 'px';
      t.el.style.height = tileSize + 'px';
      t.el.style.left = t.currentCol * tileSize + 'px';
      t.el.style.top = t.currentRow * tileSize + 'px';
      const inner = t.el.querySelector('.tile-inner');
      inner.style.backgroundSize = `${puzzlePixels}px ${puzzlePixels}px`;
      inner.style.backgroundPosition = `-${t.correctCol * tileSize}px -${t.correctRow * tileSize}px`;
    });
  });

  // ─── START ───
  init();
  updateBest();
</script>
</body>
</html>
